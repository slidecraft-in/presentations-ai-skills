name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check each SKILL.md against the Agent Skills spec
        run: |
          for skill in */SKILL.md; do
            pipx run --spec skills-ref==0.1.1 agentskills validate "./$(dirname "$skill")"
          done
